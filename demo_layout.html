<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        .box{
            border: 2px solid black;
            margin-top:auto;
            margin-bottom:auto;
            height: 120px;
            text-align:center;
            color:beige;
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="row box"><!--header start-->
            <div class="col-lg-12 text-center">
                <h2 class="text-bg-danger bkg">heading</h2>
            </div>
        </div><!--header end-->
        
        <div class="row box"><!--navigation start-->
            <div class="col-lg-12 text-center">
                <h2 class="text-bg-success bkg">navigation</h2>
            </div>
        </div><!--nav end-->

        <div class="row box"><!--main content-->
            <div class="col-lg-6 d-flex text-center">
                <div class="col-lg-6 d-flex bg-primary h-50 text-center">
                    <h2>left 1</h2>
                </div>
                <div class="col-lg-6 d-flex bg-secondary h-50 text-center">
                    <h2>left 2</h2>
                </div>
            </div>
            <div class="col-lg-6 text-center">
                <h2 class="text-bg-dark h-50">right</h2>
            </div>
        </div><!--main content-->>

        <div class="row box"><!--footer start-->
            <div class="col-lg-12 text-center">
                <h2 class="text-bg-warning bkg">footer</h2>
            </div>
        </div><!--footer end-->

    </div>
</body>
</html>
