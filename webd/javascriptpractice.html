<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // JS Variable... contains either values or not...
        // JS is case sensitive
        var myName="Shiv Goyal"; //global
        document.write(myName);
        console.log(myName);
        //var can be redeclared or reassign

        //functions
        function demo(){
            var msg="Hello ABES";
            console.log(msg);
        }

        demo();

        //variable declaration using let or const
        
        let myNumber =123423124;
        console.log(myNumber);
        //let can only be reassign not redeclare

        const myEmail = "shivgoyal@gmail.com";
        console.log(myEmail);
        //const can not be reassign as well redeclare

        //JS Execution
        //JS Scope
        //Variable Declaration
        //difference between var, let ,const
    </script>
</head>
<body>

</body>
</html>
