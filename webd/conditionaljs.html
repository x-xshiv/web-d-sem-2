<body>
    <script>
        //age verification for vote casting

        let age = 23;
        if(age>=18){
            console.log(age + " is a valid age of vote casting !!");
        }
        else{
            console.log(age + " is not valid age of vote casting !!");
        }

        //if...else...........

        //switch.........
        let grade='A';

        switch(grade){
            case 'A': result="First Division";
            break;
            case 'B': result="Second Division";
            break;
            case 'C': result="Third Division";
            break;
            default : result="Fail";
        }
        console.log(result);

        //ELSE IF LADDER

        let marks = 32;

        if(marks>60){
            console.log("First Grade")
        }
        else if(marks>40){
            console.log("Second Grade")
        }
        else if(marks>=33){
            console.log("Third Grade")
        }
        else{
            console.log("Fail !!") 
        }

    </script>
